name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Only the publishable packages; the docs site is pages.yaml's job.
      - run: pnpm --filter "./packages/*" build

      # With changesets pending, this opens/updates the version PR. With none
      # pending, it publishes. pnpm (not npm) does the publishing so the
      # workspace:^ peer ranges get rewritten into real ranges.
      - uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm publish -r --no-git-checks
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
